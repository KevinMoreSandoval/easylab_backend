spring.application.name=easylab_backend

# ==========================================
# H2 Configuration (Temporary for testing)
# ==========================================
spring.datasource.url=jdbc:h2:mem:easylab_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT Configuration
# ==========================================
jwt.secret=easylab-secret-key-super-segura-2024-debe-tener-al-menos-256-bits-ok
jwt.expiration=86400000

# ==========================================
# Server
# ==========================================
server.port=8081

# ==========================================
# Springdoc OpenAPI / Swagger UI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
